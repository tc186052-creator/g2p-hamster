name: publish
on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: build + upload lên PyPI (trusted publishing)
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC — không cần token/API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
