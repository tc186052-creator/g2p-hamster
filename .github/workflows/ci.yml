name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: cài espeak-ng (nguồn cứu phiên âm anh — tuỳ chọn runtime)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: pip install .  (đóng gói phải cài được — chặn regression)
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: CLI entry point
        run: g2p-hamster "HLV của HAGL họp HĐQT tại TP.HCM."
      - name: regression tests (88)
        run: python -m unittest discover -s tests -t . -v
